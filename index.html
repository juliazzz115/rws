<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет клиентов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .input-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        select {
            flex: 1;
            min-width: 200px;
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .status-select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .status-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff3838;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .file-input {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: #48dbfb;
        }

        .btn-secondary:hover {
            background: #0abde3;
        }

        .btn-success {
            background: #1dd1a1;
        }

        .btn-success:hover {
            background: #10ac84;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Учет клиентов</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Всего клиентов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="paidClients">0</div>
                <div class="stat-label">Оплатили</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="checkedClients">0</div>
                <div class="stat-label">Проверено / Помечено</div>
            </div>
        </div>

        <div class="input-section">
            <select id="clientSelect">
                <option value="">Выберите клиента...</option>
                <option value="Иванов Иван">Иванов Иван</option>
                <option value="Петров Петр">Петров Петр</option>
                <option value="Сидоров Сергей">Сидоров Сергей</option>
                <option value="Козлова Анна">Козлова Анна</option>
                <option value="Морозов Алексей">Морозов Алексей</option>
                <option value="Васильева Мария">Васильева Мария</option>
                <option value="Смирнов Дмитрий">Смирнов Дмитрий</option>
                <option value="Новикова Елена">Новикова Елена</option>
            </select>
            <button onclick="addClient()">➕ Добавить клиента</button>
        </div>

        <div class="button-group" style="margin-bottom: 20px;">
            <input type="file" id="csvFileInput" class="file-input" accept=".csv" onchange="loadCSV(event)">
            <button class="btn-secondary" onclick="document.getElementById('csvFileInput').click()">📂 Загрузить CSV</button>
            <button class="btn-success" onclick="exportToCSV()">💾 Экспортировать в CSV</button>
            <button class="btn-secondary" onclick="clearAllData()">🗑️ Очистить все данные</button>
        </div>

        <div class="table-container">
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>Имя клиента</th>
                        <th>Тип</th>
                        <th>Статусы</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="empty-state">
                            Нет данных. Добавьте клиента из списка выше.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let clients = [];

        function addClient() {
            const select = document.getElementById('clientSelect');
            const clientName = select.value;

            if (!clientName) {
                alert('Пожалуйста, выберите клиента!');
                return;
            }

            // Проверяем, не добавлен ли уже этот клиент
            if (clients.some(c => c.name === clientName)) {
                alert('Этот клиент уже добавлен в таблицу!');
                return;
            }

            const client = {
                id: Date.now(),
                name: clientName,
                type: 'submitted_self', // 'submitted_self' или 'paid'
                // Для "Подал сам"
                inCRM: false,
                verified: false,
                // Для "Оплатил"
                submitted: false,
                inCRM_paid: false,
                marked: false
            };

            clients.push(client);
            updateTable();
            select.value = '';
        }

        function updateTable() {
            const tbody = document.getElementById('tableBody');

            if (clients.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty-state">
                            Нет данных. Добавьте клиента из списка выше.
                        </td>
                    </tr>
                `;
                updateStats();
                return;
            }

            tbody.innerHTML = clients.map(client => {
                // Формируем чекбоксы в зависимости от типа
                let statusCheckboxes = '';
                if (client.type === 'submitted_self') {
                    statusCheckboxes = `
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.inCRM ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'inCRM')">
                            Проставлено в CRM
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.verified ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'verified')">
                            Проверено
                        </label>
                    `;
                } else { // paid
                    statusCheckboxes = `
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.submitted ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'submitted')">
                            Подали
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.inCRM_paid ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'inCRM_paid')">
                            Проставлено в CRM
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.marked ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'marked')">
                            Помечено
                        </label>
                    `;
                }

                return `
                    <tr>
                        <td><strong>${client.name}</strong></td>
                        <td>
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="radio" name="type_${client.id}"
                                        ${client.type === 'submitted_self' ? 'checked' : ''}
                                        onchange="updateClientType(${client.id}, 'submitted_self')">
                                    Подал сам
                                </label>
                                <label class="checkbox-label">
                                    <input type="radio" name="type_${client.id}"
                                        ${client.type === 'paid' ? 'checked' : ''}
                                        onchange="updateClientType(${client.id}, 'paid')">
                                    Оплатил
                                </label>
                            </div>
                        </td>
                        <td>
                            <div class="checkbox-group">
                                ${statusCheckboxes}
                            </div>
                        </td>
                        <td>
                            <button class="delete-btn" onclick="deleteClient(${client.id})">🗑️ Удалить</button>
                        </td>
                    </tr>
                `;
            }).join('');

            updateStats();
        }

        function updateClientType(clientId, type) {
            const client = clients.find(c => c.id === clientId);
            if (client) {
                client.type = type;
                // Сбрасываем все статусы при смене типа
                if (type === 'submitted_self') {
                    client.inCRM = false;
                    client.verified = false;
                } else {
                    client.submitted = false;
                    client.inCRM_paid = false;
                    client.marked = false;
                }
                updateTable();
            }
        }

        function toggleStatus(clientId, field) {
            const client = clients.find(c => c.id === clientId);
            if (client) {
                client[field] = !client[field];
                updateTable();
            }
        }

        function deleteClient(clientId) {
            if (confirm('Вы уверены, что хотите удалить этого клиента?')) {
                clients = clients.filter(c => c.id !== clientId);
                updateTable();
            }
        }

        function updateStats() {
            document.getElementById('totalClients').textContent = clients.length;
            document.getElementById('paidClients').textContent =
                clients.filter(c => c.type === 'paid').length;
            document.getElementById('checkedClients').textContent =
                clients.filter(c => c.verified || (c.type === 'paid' && c.marked)).length;
        }

        // Сохранение данных в localStorage
        function saveData() {
            localStorage.setItem('clientsData', JSON.stringify(clients));
        }

        // Загрузка данных из localStorage
        function loadData() {
            const saved = localStorage.getItem('clientsData');
            if (saved) {
                clients = JSON.parse(saved);
                updateTable();
            }
        }

        // Автосохранение при изменениях
        const originalUpdateTable = updateTable;
        updateTable = function() {
            originalUpdateTable();
            saveData();
        };

        // Загрузка CSV файла
        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseCSV(text);
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Парсинг CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            if (lines.length === 0) {
                alert('CSV файл пуст!');
                return;
            }

            // Пропускаем заголовок, если он есть
            const startIndex = lines[0].toLowerCase().includes('имя') ||
                             lines[0].toLowerCase().includes('name') ? 1 : 0;

            let addedCount = 0;
            let skippedCount = 0;

            for (let i = startIndex; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const columns = line.split(/[,;]/);  // Поддержка как запятой, так и точки с запятой
                const name = columns[0].trim().replace(/^["']|["']$/g, ''); // Удаляем кавычки

                if (!name) continue;

                // Проверяем, не добавлен ли уже этот клиент
                if (clients.some(c => c.name === name)) {
                    skippedCount++;
                    continue;
                }

                // Создаем клиента
                const type = columns[1] ? columns[1].trim().replace(/^["']|["']$/g, '') : 'submitted_self';
                const client = {
                    id: Date.now() + i,
                    name: name,
                    type: type, // 'submitted_self' или 'paid'
                    // Для "Подал сам"
                    inCRM: columns[2] === 'true' || columns[2] === '1',
                    verified: columns[3] === 'true' || columns[3] === '1',
                    // Для "Оплатил"
                    submitted: columns[4] === 'true' || columns[4] === '1',
                    inCRM_paid: columns[5] === 'true' || columns[5] === '1',
                    marked: columns[6] === 'true' || columns[6] === '1'
                };

                clients.push(client);
                addedCount++;

                // Добавляем в выпадающий список, если его там нет
                updateClientSelectOptions(name);
            }

            updateTable();

            let message = `Загружено: ${addedCount} клиент(ов)`;
            if (skippedCount > 0) {
                message += `\nПропущено (уже есть в списке): ${skippedCount} клиент(ов)`;
            }
            alert(message);

            // Очищаем input для возможности повторной загрузки того же файла
            event.target.value = '';
        }

        // Обновление выпадающего списка клиентов
        function updateClientSelectOptions(newName) {
            const select = document.getElementById('clientSelect');
            const existingOptions = Array.from(select.options).map(opt => opt.value);

            if (!existingOptions.includes(newName)) {
                const option = document.createElement('option');
                option.value = newName;
                option.textContent = newName;
                select.appendChild(option);
            }
        }

        // Экспорт в CSV
        function exportToCSV() {
            if (clients.length === 0) {
                alert('Нет данных для экспорта!');
                return;
            }

            let csv = 'Имя клиента,Тип,Проставлено в CRM (подал сам),Проверено,Подали (оплатил),Проставлено в CRM (оплатил),Помечено\n';

            clients.forEach(client => {
                csv += `"${client.name}",`;
                csv += `"${client.type}",`;
                csv += `${client.inCRM ? '1' : '0'},`;
                csv += `${client.verified ? '1' : '0'},`;
                csv += `${client.submitted ? '1' : '0'},`;
                csv += `${client.inCRM_paid ? '1' : '0'},`;
                csv += `${client.marked ? '1' : '0'}\n`;
            });

            // Создаем blob и скачиваем файл
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `clients_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Очистка всех данных
        function clearAllData() {
            if (confirm('Вы уверены, что хотите удалить ВСЕ данные? Это действие нельзя отменить!')) {
                clients = [];
                updateTable();
                alert('Все данные удалены!');
            }
        }

        // Загрузка данных при старте
        loadData();
    </script>
</body>
</html>
