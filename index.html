<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWS 12.2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(179, 229, 252, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(129, 212, 250, 0.15), transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(179, 229, 252, 0.15), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(129, 212, 250, 0.3);
            box-shadow:
                0 8px 32px 0 rgba(129, 212, 250, 0.2),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #000000;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(129, 212, 250, 0.3);
            letter-spacing: 2px;
        }

        .input-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], select, button {
            padding: 10px 15px;
            border: 1px solid rgba(129, 212, 250, 0.4);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #000000;
            text-shadow: none;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

        input[type="text"]::placeholder {
            color: rgba(0, 0, 0, 0.4);
            text-shadow: none;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #81d4fa;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 12px rgba(129, 212, 250, 0.3);
        }

        select {
            min-width: 200px;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            color: #000000;
        }

        select option {
            background: #ffffff;
            color: #000000;
            text-shadow: none;
        }

        select:focus {
            outline: none;
            border-color: #81d4fa;
            background: rgba(255, 255, 255, 0.95);
        }

        button {
            background: rgba(129, 212, 250, 0.3);
            color: #000000;
            border: 1px solid rgba(129, 212, 250, 0.5);
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(129, 212, 250, 0.2);
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        button:hover {
            background: rgba(129, 212, 250, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(129, 212, 250, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(129, 212, 250, 0.2);
            color: #000000;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        th {
            background: rgba(129, 212, 250, 0.3);
            color: #000000;
            font-weight: 600;
            font-size: 14px;
            position: sticky;
            top: 0;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        tr:hover {
            background: rgba(129, 212, 250, 0.1);
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #000000;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #81d4fa;
            filter: brightness(1.2);
        }

        .status-select {
            padding: 6px 10px;
            border: 1px solid rgba(129, 212, 250, 0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            color: #000000;
            text-shadow: none;
        }

        .status-select:focus {
            outline: none;
            border-color: #81d4fa;
            background: rgba(255, 255, 255, 0.95);
        }

        .delete-btn {
            background: rgba(231, 76, 60, 0.8);
            color: white;
            border: 1px solid rgba(231, 76, 60, 0.8);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        .delete-btn:hover {
            background: rgba(192, 57, 43, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(0, 0, 0, 0.6);
            font-size: 18px;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #000000;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(129, 212, 250, 0.3);
            box-shadow: 0 4px 12px rgba(129, 212, 250, 0.15);
        }

        .stat-number {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #81d4fa;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        .stat-label {
            font-size: 0.85em;
            color: rgba(0, 0, 0, 0.7);
            font-weight: 500;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        .file-input {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: rgba(149, 165, 166, 0.5);
            color: #000000;
            font-size: 12px;
            padding: 8px 12px;
        }

        .btn-secondary:hover {
            background: rgba(127, 140, 141, 0.6);
        }

        .btn-success {
            background: rgba(39, 174, 96, 0.5);
            color: #000000;
            font-size: 12px;
            padding: 8px 12px;
        }

        .btn-success:hover {
            background: rgba(34, 153, 84, 0.6);
        }

        /* Autocomplete стили */
        .autocomplete-container {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .autocomplete-input {
            width: 100%;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(129, 212, 250, 0.4);
            border-top: none;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 8px 16px rgba(129, 212, 250, 0.2);
            z-index: 1000;
            display: none;
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(129, 212, 250, 0.2);
            transition: all 0.2s ease;
            color: #000000;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        .autocomplete-item:hover {
            background: rgba(129, 212, 250, 0.2);
        }

        .autocomplete-item.selected {
            background: rgba(129, 212, 250, 0.3);
        }

        .autocomplete-item strong {
            color: #000000;
            font-weight: 700;
        }

        .autocomplete-empty {
            padding: 10px 15px;
            color: rgba(0, 0, 0, 0.5);
            font-style: italic;
            text-shadow: none;
            -webkit-text-stroke: 0;
        }

        /* Адаптив для планшетов */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4em;
                margin-bottom: 20px;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                min-width: 120px;
                padding: 12px;
            }

            .stat-number {
                font-size: 1.5em;
            }

            .stat-label {
                font-size: 0.8em;
            }

            .input-section {
                flex-direction: column;
                gap: 10px;
            }

            .autocomplete-container {
                width: 100%;
                min-width: auto;
            }

            .autocomplete-input {
                font-size: 16px; /* Предотвращает зум на iOS */
            }

            .autocomplete-item {
                padding: 12px 15px;
                font-size: 14px;
            }

            input[type="text"], select, button {
                width: 100%;
                font-size: 16px; /* Предотвращает зум на iOS */
            }

            select {
                min-width: auto;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button {
                width: 100%;
            }

            th, td {
                padding: 10px 8px;
                font-size: 13px;
            }

            .checkbox-group {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }

            .status-select {
                width: 100%;
            }
        }

        /* Адаптив для мобильных телефонов */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 10px;
                border-radius: 0;
            }

            h1 {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }

            .stat-card {
                width: 100%;
                min-width: auto;
                padding: 10px;
            }

            .stat-number {
                font-size: 1.3em;
            }

            .stat-label {
                font-size: 0.75em;
            }

            .autocomplete-dropdown {
                max-height: 250px;
            }

            .autocomplete-item {
                padding: 14px 12px;
                font-size: 13px;
            }

            input[type="text"], select, button {
                padding: 12px;
                font-size: 16px;
            }

            th, td {
                padding: 8px 5px;
                font-size: 12px;
            }

            th {
                font-size: 13px;
            }

            .table-container {
                margin: 0 -10px;
            }

            table {
                font-size: 11px;
            }

            .checkbox-label {
                font-size: 12px;
            }

            input[type="checkbox"], input[type="radio"] {
                width: 18px;
                height: 18px;
            }

            .delete-btn {
                padding: 8px 10px;
                font-size: 12px;
                width: 100%;
            }

            .empty-state {
                padding: 20px;
                font-size: 14px;
            }

            button {
                min-height: 44px; /* iOS рекомендуемый размер для кнопок */
            }
        }

        /* Очень маленькие экраны */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.1em;
            }

            .stat-number {
                font-size: 1.2em;
            }

            th, td {
                padding: 6px 3px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RWS 12.2025</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Всего клиентов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inCRMClients">0</div>
                <div class="stat-label">Проставлено в CRM</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="verifiedClients">0</div>
                <div class="stat-label">Проверено</div>
            </div>
        </div>

        <div class="input-section">
            <div class="autocomplete-container">
                <input type="text"
                       id="clientInput"
                       class="autocomplete-input"
                       placeholder="Введите NIP или название клиента..."
                       oninput="handleAutocomplete()"
                       onfocus="handleAutocomplete()"
                       onkeydown="handleKeydown(event)">
                <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
            </div>
            <button onclick="addClient()">Добавить в таблицу</button>
        </div>

        <div class="button-group" style="margin-bottom: 20px;">
            <input type="file" id="csvFileInput" class="file-input" accept=".csv" onchange="loadCSV(event)">
            <button class="btn-secondary" onclick="document.getElementById('csvFileInput').click()">Загрузить CSV</button>
            <input type="file" id="importTableInput" class="file-input" accept=".csv" onchange="importTableData(event)">
            <button class="btn-secondary" onclick="document.getElementById('importTableInput').click()">Импортировать таблицу</button>
            <button class="btn-success" onclick="exportToCSV()">Экспортировать CSV</button>
            <button class="btn-secondary" onclick="clearAllData()">Очистить данные</button>
        </div>

        <div class="table-container">
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>NIP</th>
                        <th>Nazwa firmy</th>
                        <th>Тип</th>
                        <th>Статусы</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            Нет данных. Введите NIP и название фирмы.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Проверка, запущен ли сервер (есть ли API)
        let useServerSync = false;
        let availableClients = []; // Клиенты загруженные из CSV, доступные для выбора
        let clients = []; // Клиенты добавленные в таблицу
        let selectedClientNIP = null; // Выбранный клиент для добавления
        let currentFocusIndex = -1; // Текущий выделенный элемент в dropdown
        let isSaving = false; // Флаг блокировки синхронизации во время сохранения

        // Инициализация приложения
        async function initApp() {
            // Проверяем доступность API
            try {
                const response = await fetch('/api/data');
                if (response.ok) {
                    useServerSync = true;
                    console.log('✅ Синхронизация с сервером включена');
                } else {
                    console.log('📱 Работа в локальном режиме (только localStorage)');
                }
            } catch (error) {
                console.log('📱 Работа в локальном режиме (только localStorage)');
            }

            // Загружаем данные после проверки сервера
            await loadData();
        }

        // Autocomplete функции
        function handleAutocomplete() {
            const input = document.getElementById('clientInput');
            const dropdown = document.getElementById('autocompleteDropdown');
            const searchTerm = input.value.toLowerCase().trim();

            currentFocusIndex = -1;

            if (!searchTerm) {
                // Показываем всех клиентов если поле пустое
                showAllClients(dropdown);
                return;
            }

            // Фильтруем клиентов
            const filteredClients = availableClients.filter(client => {
                const nipMatch = client.nip.toLowerCase().includes(searchTerm);
                const nazwaMatch = client.nazwa.toLowerCase().includes(searchTerm);
                return nipMatch || nazwaMatch;
            });

            displayAutocompleteResults(dropdown, filteredClients, searchTerm);
        }

        function showAllClients(dropdown) {
            if (availableClients.length === 0) {
                dropdown.innerHTML = '<div class="autocomplete-empty">Загрузите CSV файл с клиентами</div>';
                dropdown.classList.add('show');
                return;
            }

            displayAutocompleteResults(dropdown, availableClients, '');
        }

        function displayAutocompleteResults(dropdown, clients, searchTerm) {
            dropdown.innerHTML = '';

            if (clients.length === 0) {
                dropdown.innerHTML = '<div class="autocomplete-empty">Ничего не найдено</div>';
                dropdown.classList.add('show');
                return;
            }

            clients.forEach((client, index) => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.dataset.nip = client.nip;
                div.dataset.index = index;

                // Подсвечиваем совпадения
                let displayText = `${client.nip} - ${client.nazwa}`;
                if (searchTerm) {
                    const regex = new RegExp(`(${searchTerm})`, 'gi');
                    displayText = displayText.replace(regex, '<strong>$1</strong>');
                }

                div.innerHTML = displayText;
                div.onclick = () => selectClient(client.nip);
                dropdown.appendChild(div);
            });

            dropdown.classList.add('show');
        }

        function selectClient(nip) {
            const client = availableClients.find(c => c.nip === nip);
            if (client) {
                const input = document.getElementById('clientInput');
                input.value = `${client.nip} - ${client.nazwa}`;
                selectedClientNIP = nip;
                hideAutocomplete();
            }
        }

        function hideAutocomplete() {
            const dropdown = document.getElementById('autocompleteDropdown');
            dropdown.classList.remove('show');
            currentFocusIndex = -1;
        }

        function handleKeydown(event) {
            const dropdown = document.getElementById('autocompleteDropdown');
            const items = dropdown.querySelectorAll('.autocomplete-item');

            if (items.length === 0) return;

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                currentFocusIndex++;
                if (currentFocusIndex >= items.length) currentFocusIndex = 0;
                setActiveItem(items);
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                currentFocusIndex--;
                if (currentFocusIndex < 0) currentFocusIndex = items.length - 1;
                setActiveItem(items);
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (currentFocusIndex > -1 && items[currentFocusIndex]) {
                    items[currentFocusIndex].click();
                } else {
                    addClient();
                }
            } else if (event.key === 'Escape') {
                hideAutocomplete();
            }
        }

        function setActiveItem(items) {
            items.forEach((item, index) => {
                if (index === currentFocusIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function addClient() {
            if (!selectedClientNIP) {
                alert('Пожалуйста, выберите клиента из списка!');
                return;
            }

            // Находим клиента в доступных
            const availableClient = availableClients.find(c => c.nip === selectedClientNIP);
            if (!availableClient) {
                alert('Клиент не найден!');
                return;
            }

            // Проверяем, не добавлен ли уже этот клиент в таблицу
            if (clients.some(c => c.nip === selectedClientNIP)) {
                alert('Этот клиент уже добавлен в таблицу!');
                return;
            }

            const client = {
                id: Date.now(),
                nip: availableClient.nip,
                nazwa: availableClient.nazwa,
                type: 'submitted_self', // 'submitted_self' или 'paid'
                // Для "Подал сам"
                inCRM: false,
                verified: false,
                // Для "Оплатил"
                submitted: false,
                inCRM_paid: false,
                marked: false
            };

            clients.push(client);
            updateTable();

            // Очищаем поле ввода
            const input = document.getElementById('clientInput');
            input.value = '';
            selectedClientNIP = null;
            hideAutocomplete();
        }

        function updateTable(skipSave = false) {
            const tbody = document.getElementById('tableBody');

            if (clients.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            Нет данных. Введите NIP и название фирмы.
                        </td>
                    </tr>
                `;
                updateStats();
                if (!skipSave) saveData();
                return;
            }

            tbody.innerHTML = clients.map(client => {
                // Формируем чекбоксы в зависимости от типа
                let statusCheckboxes = '';
                if (client.type === 'submitted_self') {
                    statusCheckboxes = `
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.inCRM ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'inCRM')">
                            Проставлено в CRM
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.verified ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'verified')">
                            Проверено
                        </label>
                    `;
                } else { // paid
                    statusCheckboxes = `
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.submitted ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'submitted')">
                            Подали
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.inCRM_paid ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'inCRM_paid')">
                            Проставлено в CRM
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox"
                                ${client.marked ? 'checked' : ''}
                                onchange="toggleStatus(${client.id}, 'marked')">
                            Проверено
                        </label>
                    `;
                }

                return `
                    <tr>
                        <td><strong>${client.nip}</strong></td>
                        <td>${client.nazwa}</td>
                        <td>
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="radio" name="type_${client.id}"
                                        ${client.type === 'submitted_self' ? 'checked' : ''}
                                        onchange="updateClientType(${client.id}, 'submitted_self')">
                                    Подал сам
                                </label>
                                <label class="checkbox-label">
                                    <input type="radio" name="type_${client.id}"
                                        ${client.type === 'paid' ? 'checked' : ''}
                                        onchange="updateClientType(${client.id}, 'paid')">
                                    Оплатил
                                </label>
                            </div>
                        </td>
                        <td>
                            <div class="checkbox-group">
                                ${statusCheckboxes}
                            </div>
                        </td>
                        <td>
                            <button class="delete-btn" onclick="deleteClient(${client.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            }).join('');

            updateStats();
            if (!skipSave) saveData();
        }

        function updateClientType(clientId, type) {
            const client = clients.find(c => c.id === clientId);
            if (client) {
                client.type = type;
                // Сбрасываем все статусы при смене типа
                if (type === 'submitted_self') {
                    client.inCRM = false;
                    client.verified = false;
                } else {
                    client.submitted = false;
                    client.inCRM_paid = false;
                    client.marked = false;
                }
                updateTable();
            }
        }

        function toggleStatus(clientId, field) {
            const client = clients.find(c => c.id === clientId);
            if (client) {
                client[field] = !client[field];
                updateTable();
            }
        }

        function deleteClient(clientId) {
            if (confirm('Вы уверены, что хотите удалить этого клиента?')) {
                clients = clients.filter(c => c.id !== clientId);
                updateTable();
            }
        }

        function updateStats() {
            document.getElementById('totalClients').textContent = clients.length;
            document.getElementById('inCRMClients').textContent =
                clients.filter(c => c.inCRM || c.inCRM_paid).length;
            document.getElementById('verifiedClients').textContent =
                clients.filter(c => c.verified || c.marked).length;
        }

        // Сохранение данных (localStorage + сервер)
        async function saveData() {
            // Блокируем синхронизацию во время сохранения
            isSaving = true;

            try {
                // Сохранение в localStorage как резервная копия
                localStorage.setItem('clientsData', JSON.stringify(clients));
                localStorage.setItem('availableClientsData', JSON.stringify(availableClients));

                // Синхронизация с сервером
                if (useServerSync) {
                    try {
                        const response = await fetch('/api/data', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                clients: clients,
                                availableClients: availableClients
                            })
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            console.error('❌ Ошибка сохранения на сервер:', response.status, errorText);
                            alert('Ошибка сохранения данных на сервер! Проверьте консоль для деталей.');
                        } else {
                            console.log('✅ Данные сохранены на сервер (клиентов: ' + clients.length + ')');
                        }
                    } catch (error) {
                        console.error('❌ Ошибка сохранения на сервер:', error);
                        alert('Ошибка сохранения данных: ' + error.message);
                    }
                }
            } finally {
                // Разблокируем синхронизацию после завершения сохранения
                isSaving = false;
            }
        }

        // Загрузка данных (из сервера или localStorage)
        async function loadData() {
            if (useServerSync) {
                try {
                    const response = await fetch('/api/data');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.clients && data.clients.length > 0) {
                            clients = data.clients;
                            updateTable(true); // skipSave=true, чтобы не сохранять сразу после загрузки
                        } else {
                            loadFromLocalStorage();
                        }

                        if (data.availableClients && data.availableClients.length > 0) {
                            availableClients = data.availableClients;
                        } else {
                            const savedAvailable = localStorage.getItem('availableClientsData');
                            if (savedAvailable) {
                                availableClients = JSON.parse(savedAvailable);
                            }
                        }

                        // Периодическая синхронизация с сервером (каждые 5 секунд)
                        setInterval(syncFromServer, 5000);
                    } else {
                        loadFromLocalStorage();
                    }
                } catch (error) {
                    console.error('Ошибка загрузки с сервера:', error);
                    loadFromLocalStorage();
                }
            } else {
                // Загрузка только из localStorage если сервер недоступен
                loadFromLocalStorage();
            }
        }

        // Синхронизация с сервера (периодическая)
        async function syncFromServer() {
            // Пропускаем синхронизацию если идет сохранение
            if (isSaving) {
                console.log('⏸️ Пропуск синхронизации - идет сохранение');
                return;
            }

            try {
                const response = await fetch('/api/data');
                if (response.ok) {
                    const data = await response.json();

                    // Обновляем клиентов если данные изменились
                    if (data.clients && JSON.stringify(data.clients) !== JSON.stringify(clients)) {
                        clients = data.clients;
                        // Обновляем таблицу БЕЗ вызова saveData (чтобы избежать рекурсии)
                        updateTable(true); // skipSave=true
                        console.log('🔄 Синхронизация: обновлено клиентов');
                    }

                    // Обновляем доступных клиентов если данные изменились
                    if (data.availableClients && JSON.stringify(data.availableClients) !== JSON.stringify(availableClients)) {
                        availableClients = data.availableClients;
                        console.log('🔄 Синхронизация: обновлено доступных клиентов');
                    }
                }
            } catch (error) {
                console.error('❌ Ошибка синхронизации:', error);
            }
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('clientsData');
            if (saved) {
                clients = JSON.parse(saved);
                updateTable(true); // skipSave=true, чтобы не сохранять сразу после загрузки
            }

            const savedAvailable = localStorage.getItem('availableClientsData');
            if (savedAvailable) {
                availableClients = JSON.parse(savedAvailable);
            }
        }

        // Загрузка CSV файла
        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseCSV(text);
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Парсинг CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            if (lines.length === 0) {
                alert('CSV файл пуст!');
                return;
            }

            // Пропускаем заголовок, если он есть
            const startIndex = lines[0].toLowerCase().includes('nip') ||
                             lines[0].toLowerCase().includes('nazwa') ? 1 : 0;

            let addedCount = 0;
            let skippedCount = 0;

            for (let i = startIndex; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const columns = line.split(/[,;]/);  // Поддержка как запятой, так и точки с запятой
                const nip = columns[0].trim().replace(/^["']|["']$/g, ''); // Удаляем кавычки

                if (!nip) continue;

                const nazwa = columns[1] ? columns[1].trim().replace(/^["']|["']$/g, '') : '';
                if (!nazwa) continue;

                // Проверяем, не добавлен ли уже этот клиент в список доступных
                if (availableClients.some(c => c.nip === nip)) {
                    skippedCount++;
                    continue;
                }

                // Создаем клиента для списка выбора
                const client = {
                    nip: nip,
                    nazwa: nazwa
                };

                availableClients.push(client);
                addedCount++;
            }

            // ВАЖНО: Сохраняем данные на сервер для синхронизации!
            saveData();

            let message = `Загружено клиентов в список: ${addedCount}`;
            if (skippedCount > 0) {
                message += `\nПропущено (уже есть): ${skippedCount}`;
            }
            alert(message);

            // Очищаем input для возможности повторной загрузки того же файла
            event.target.value = '';
        }

        // Экспорт в CSV
        function exportToCSV() {
            if (clients.length === 0) {
                alert('Нет данных для экспорта!');
                return;
            }

            let csv = 'NIP,Nazwa firmy,Тип,Проставлено в CRM (подал сам),Проверено,Подали (оплатил),Проставлено в CRM (оплатил),Помечено\n';

            clients.forEach(client => {
                csv += `"${client.nip}",`;
                csv += `"${client.nazwa}",`;
                csv += `"${client.type}",`;
                csv += `${client.inCRM ? '1' : '0'},`;
                csv += `${client.verified ? '1' : '0'},`;
                csv += `${client.submitted ? '1' : '0'},`;
                csv += `${client.inCRM_paid ? '1' : '0'},`;
                csv += `${client.marked ? '1' : '0'}\n`;
            });

            // Создаем blob и скачиваем файл
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `clients_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Импорт данных таблицы из CSV
        function importTableData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n').filter(line => line.trim());

                    if (lines.length < 2) {
                        alert('Файл пустой или содержит только заголовок!');
                        return;
                    }

                    // Пропускаем заголовок
                    const dataLines = lines.slice(1);
                    const importedClients = [];

                    dataLines.forEach((line, index) => {
                        try {
                            // Парсинг CSV с учетом кавычек
                            const matches = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                            if (!matches || matches.length < 8) {
                                console.warn(`Строка ${index + 2} пропущена: неверный формат`);
                                return;
                            }

                            // Убираем кавычки из значений
                            const values = matches.map(val => val.replace(/^"|"$/g, '').trim());

                            const client = {
                                id: Date.now() + index, // Уникальный ID
                                nip: values[0],
                                nazwa: values[1],
                                type: values[2],
                                inCRM: values[3] === '1',
                                verified: values[4] === '1',
                                submitted: values[5] === '1',
                                inCRM_paid: values[6] === '1',
                                marked: values[7] === '1'
                            };

                            importedClients.push(client);
                        } catch (err) {
                            console.error(`Ошибка парсинга строки ${index + 2}:`, err);
                        }
                    });

                    if (importedClients.length === 0) {
                        alert('Не удалось импортировать данные. Проверьте формат файла.');
                        return;
                    }

                    // Спрашиваем пользователя о замене или добавлении
                    const replace = confirm(
                        `Найдено ${importedClients.length} записей.\n\n` +
                        `Заменить текущие данные (${clients.length} записей)?\n\n` +
                        `OK - Заменить все данные\n` +
                        `Отмена - Добавить к существующим`
                    );

                    if (replace) {
                        clients = importedClients;
                        alert(`Импортировано ${importedClients.length} записей. Предыдущие данные заменены.`);
                    } else {
                        // Проверяем дубликаты по NIP
                        const existingNips = new Set(clients.map(c => c.nip));
                        const newClients = importedClients.filter(c => !existingNips.has(c.nip));
                        const duplicates = importedClients.length - newClients.length;

                        clients = clients.concat(newClients);
                        alert(
                            `Добавлено ${newClients.length} новых записей.\n` +
                            (duplicates > 0 ? `Пропущено ${duplicates} дубликатов.` : '')
                        );
                    }

                    updateTable();

                    // Очищаем input для возможности повторной загрузки
                    event.target.value = '';

                } catch (error) {
                    console.error('Ошибка импорта:', error);
                    alert('Ошибка при импорте файла! Проверьте консоль для деталей.');
                }
            };

            reader.onerror = function() {
                alert('Ошибка чтения файла!');
            };

            reader.readAsText(file, 'UTF-8');
        }

        // Очистка всех данных
        function clearAllData() {
            if (confirm('Вы уверены, что хотите удалить ВСЕ данные? Это действие нельзя отменить!')) {
                clients = [];
                updateTable();
                alert('Все данные удалены!');
            }
        }

        // Закрытие autocomplete при клике вне области
        document.addEventListener('click', function(event) {
            const autocompleteContainer = document.querySelector('.autocomplete-container');
            const dropdown = document.getElementById('autocompleteDropdown');

            if (autocompleteContainer && !autocompleteContainer.contains(event.target)) {
                hideAutocomplete();
            }
        });

        // Инициализация приложения при старте
        initApp();
    </script>
</body>
</html>
